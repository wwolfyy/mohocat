<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CodeGraph — mohocat</title>
    <style>
      body {
        margin: 0;
        background: #0f1117;
        color: #e6e8ee;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        padding: 10px 16px;
        border-bottom: 1px solid #2a2f3a;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      a {
        color: #8ab4ff;
        text-decoration: none;
        margin-right: 12px;
      }
      a.active {
        color: #fff;
        font-weight: 600;
      }
      .wrap {
        padding: 12px;
      }
      object,
      img {
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>CodeGraph — mohocat</strong>
      <span
        ><a href="?g=dirs" id="a1">directory-level</a
        ><a href="?g=files" id="a2">file-level (709 edges)</a
        ><a href="?g=symbols" id="a3">full symbols (1,979)</a></span
      >
      <span style="margin-left: auto; opacity: 0.6"
        >generated by the evaluation exporter — CodeGraph ships no visualization</span
      >
    </header>
    <div class="wrap"><img id="svg" src="graph-dirs.svg" /></div>
    <script>
      const g = new URLSearchParams(location.search).get('g') || 'dirs';
      const map = { dirs: 'graph-dirs.svg', files: 'graph-files.svg', symbols: 'graph.svg' };
      document.getElementById('svg').src = map[g] || map.dirs;
      ({ dirs: 'a1', files: 'a2', symbols: 'a3' })[g] &&
        document
          .getElementById({ dirs: 'a1', files: 'a2', symbols: 'a3' }[g])
          .classList.add('active');
    </script>
  </body>
</html>
