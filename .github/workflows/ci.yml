name: CI

# Gates the push-based Vercel flow (dev → Preview, main → Production): run on PRs
# to dev/main and on pushes to dev. No deploy steps here — Vercel owns deploys.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural gate (~1–2 min): types, lint, and the Vitest suites. No server,
  # no Firebase, no secrets.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit + smoke tests
        run: npm test

  # Work registry (work_tracking/). Three gates: the store must load without a constraint
  # error, registry.md must equal build(registry.ndjson) — a hand-edited or unrebuilt
  # registry.md is caught here rather than drifting silently — and the living documents must
  # stay inside the budgets in work_tracking/size-policy.json.
  #
  # The size gate is here rather than written down as a rule because a rule is what failed:
  # docs/handoff/archive/ already held 34 files, so the archive mechanism was never missing,
  # it just stopped being applied and HANDOFF.md regrew to 3,396 lines (R-0424).
  #
  # Deliberately independent of the app: no `npm ci` (this tooling has zero dependencies)
  # and no `needs:`, so it reports even when the app build is red. Node 24 rather than the
  # 20 the other jobs use, because node:sqlite does not exist on 20.
  work-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tooling tests
        run: node work_tracking/tests/run.js
      - name: registry.md matches registry.ndjson
        run: node work_tracking/scripts/build.js --check
      - name: Living documents are within budget
        run: node work_tracking/scripts/size-check.js --report

  # Emulator-backed Firestore security-rules tests (mountain-aware role model, M5.2).
  # The default `npm test` excludes tests/rules/** (they need the emulator), so this
  # is the only place a rules regression is caught. Needs just the Firestore emulator
  # + JVM — no browser — so it's much lighter than the e2e job.
  rules:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Firebase emulators are JVM processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Run Firestore rules tests (emulator)
        run: npm run test:rules

  # Emulator-backed tests for the migration scripts under scripts/migration/.
  # Same shape and cost as the rules job (Firestore emulator + JVM, no browser,
  # no secrets) and excluded from `npm test` for the same reason.
  #
  # 🔑 Hermetic without a service-account key: rename-cat.js takes a
  # credential-less path when FIRESTORE_EMULATOR_HOST is set, and refuses to run
  # unless the project is demo-*. That guard is itself one of the assertions here
  # — it is what keeps a CI secret from ever being the price of this coverage.
  scripts:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Firebase emulators are JVM processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Run migration-script tests (emulator)
        run: npm run test:scripts

  # Emulator-backed Playwright e2e. Hermetic: a demo-* Firebase project with fake
  # keys means NO GitHub secrets are required. Also covers the two-tenant isolation
  # specs (tests/e2e/**/tenant-isolation.spec.ts) — no extra wiring needed.
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Firebase emulators are JVM processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      # Cache the Playwright browser binaries and the Firebase emulator jars so
      # only the first run pays the download cost.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Single wrapper: emulators up → seed → prod build (Admin SDK reads + asset
      # fetch against the emulators) → next start → Playwright. Env (fake NEXT_PUBLIC_*
      # + emulator hosts) propagates through the whole tree via `.env.test` +
      # `emulators:exec`. CI=true → retries:2, workers:2, no server reuse.
      - name: Run e2e (emulators + Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
